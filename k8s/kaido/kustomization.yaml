apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: andrusdiaz-playground
resources:
  - app.yaml
configMapGenerator:
  - name: andrus-diaz-playground-site
    files:
      - index.html=site/index.html
generatorOptions:
  labels:
    app.kubernetes.io/name: andrus-diaz-playground
    app.kubernetes.io/part-of: andrusdiaz-playground
