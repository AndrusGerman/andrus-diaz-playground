<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Andrus Díaz Playground</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      body { align-items: center; background: #0d1020; color: #edf1ff; display: flex; margin: 0; min-height: 100vh; }
      main { margin: auto; max-width: 42rem; padding: 2rem; }
      h1 { font-size: clamp(2rem, 8vw, 4.5rem); line-height: .95; margin: 0 0 1rem; }
      p { color: #b9c4e0; font-size: 1.15rem; line-height: 1.65; }
      .message { color: #ffd6e7; font-size: clamp(1.5rem, 5vw, 2.4rem); font-weight: 700; }
      code { background: #20284a; border-radius: .4rem; color: #9ee7d4; padding: .18rem .4rem; }
      .dot { color: #7cf0bf; }
    </style>
  </head>
  <body>
    <main>
      <p class="dot">● online</p>
      <h1>Andrus Díaz<br />Playground</h1>
      <p class="message">Hola bebe te amo a mimi</p>
    </main>
  </body>
</html>
