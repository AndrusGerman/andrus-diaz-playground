apiVersion: apps/v1
kind: Deployment
metadata:
  name: andrus-diaz-playground
  labels:
    app.kubernetes.io/name: andrus-diaz-playground
    app.kubernetes.io/part-of: andrusdiaz-playground
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: andrus-diaz-playground
  template:
    metadata:
      labels:
        app: andrus-diaz-playground
        app.kubernetes.io/name: andrus-diaz-playground
        app.kubernetes.io/part-of: andrusdiaz-playground
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: docker.io/nginxinc/nginx-unprivileged:1.27-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          volumeMounts:
            - name: site
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: site
          configMap:
            name: andrus-diaz-playground-site
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
---
apiVersion: v1
kind: Service
metadata:
  name: andrus-diaz-playground
  labels:
    app.kubernetes.io/name: andrus-diaz-playground
    app.kubernetes.io/part-of: andrusdiaz-playground
spec:
  type: ClusterIP
  selector:
    app: andrus-diaz-playground
  ports:
    - name: http
      port: 80
      targetPort: http
